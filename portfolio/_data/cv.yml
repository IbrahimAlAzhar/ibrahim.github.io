          - Deployed LLMs across GPUs with vLLM, Ray, tensor parallelism, FP16/BF16, and quantization; profiled GPU-hours, latency, throughput, and quality–cost trade-offs.
          - Investigated manuscript-based prompt injection, gradient-optimized attacks, provenance-aware detection, and causal evidence interference via activation patching.
          - Co-authored interdisciplinary research in biomedical text, multimodal scientific figures, and code security; contributed to NSF and DARPA proposal development.

