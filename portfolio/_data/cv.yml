        highlights:
          - Designed hierarchical multi-agent systems for scientific critique and synthesis using specialist roles, shared evidence memory, retrieval-augmented generation, tool-use trajectories, and iterative feedback.
          - Built scalable scholarly search pipelines with BM25/dense hybrid retrieval, reranking, citation graphs, GraphSAGE, and a 120K-paper evidence index; developed atomic limitation-level evaluation.
